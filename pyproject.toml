[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioalign-emg"
version = "1.0.0"
description = "Reproducibility code for BioAlign-EMG electrode-shift-robust myoelectric decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "openpyxl>=3.1,<4",
  "tqdm>=4.66,<5",
  "torch>=2.1",
]

[tool.setuptools.packages.find]
include = ["bioalign_emg*"]
